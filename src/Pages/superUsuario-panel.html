<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Bike Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../CSS/superUsuario-panel.css">
</head>

<body>
    <div class="notification" id="notification"></div>

    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="../img/logocion.png" alt="Bike Store Logo">
                <h3>Super Usuario Panel</h3>
            </div>
            <ul class="sidebar-menu">
                <li class="active" onclick="showSection('usuarios')">
                    <i class="fas fa-user-shield"></i>
                    <span>Administradores</span>
                </li>
                <li onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar sesión</span>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Usuarios Section -->
            <div class="section active" id="usuarios">
                <div class="page-header">
                    <h1>Gestión de Administradores</h1>
                    <button class="btn-add" onclick="showUserModal()">
                        <i class="fas fa-plus"></i> Nuevo Administrador
                    </button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-tabla">
                        <!-- Aquí se cargarán los administradores dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Administrador -->
    <div id="usuarioModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeUserModal()">&times;</span>
            <h2 id="modalUserTitle">Nuevo Administrador</h2>
            <form id="usuarioForm" class="product-form">
                <input type="hidden" id="usuarioId">
                <div class="form-group">
                    <label for="nombreUsuario">Nombre:</label>
                    <input type="text" id="nombreUsuario" class="form-control" pattern="[a-zA-Z]{3,}[a-zA-Z0-9 ]*"
                        required title="Ingrese el Nombre correctamente">
                </div>
                <div class="form-group">
                    <label for="apellidoUsuario">Apellido:</label>
                    <input type="text" id="apellidoUsuario" class="form-control" pattern="[a-zA-Z]{3,}[a-zA-Z0-9 ]*"
                        title="Ingrese el Apellido correctamente" required>
                </div>
                <div class="form-group">
                    <label for="emailUsuario">Email:</label>
                    <input type="email" id="emailUsuario" class="form-control"
                        pattern="[a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*@[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*\.[a-zA-Z]{2,}"
                        title="Solo se permiten letras, números, puntos, guiones y guión bajo. El email debe tener un formato válido como: usuario@dominio.com"
                        oninput="this.setCustomValidity('')"
                        oninvalid="this.setCustomValidity('Formato de email inválido. Solo se permiten letras, números, puntos, guiones y guión bajo.')"
                        required>   
                </div>
                <div class="form-group">
                    <label for="contrasenaUsuario">Contraseña:</label>
                    <input type="password" id="contrasenaUsuario" class="form-control" pattern="[^.:*'|°¬]+"
                        title="La contraseña no debe contener los caracteres: . : * ' | ° ¬" minlength="8" required
                        onpaste="return false;" oncopy="return false;" oncut="return false;" placeholder=" ">
                </div>
                <button type="submit" class="btn-submit">Guardar Administrador</button>
            </form>
        </div>
    </div>

    <script src="../JavaScript/superUsuario-panel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.0/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        // Validación de email para el campo emailUsuario
        document.addEventListener('DOMContentLoaded', function() {
            const emailInput = document.getElementById('emailUsuario');
            
            if (emailInput) {
                // Patrón estricto para validación de email
                const emailPattern = /^[a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*@[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*\.[a-zA-Z]{2,}$/;
                
                // Lista de caracteres prohibidos
                const forbiddenChars = /[!@#$%^&*()+=\[\]{}|\\:";'<>?,/`~]/;
                
                function validateEmail(email) {
                    // Verificar que no esté vacío
                    if (!email || email.trim() === '') {
                        return false;
                    }
                    
                    // Verificar caracteres prohibidos (excepto @ que es necesario para el email)
                    const emailParts = email.split('@');
                    if (emailParts.length !== 2) {
                        return false;
                    }
                    
                    // Verificar caracteres prohibidos en la parte local (antes del @)
                    const localPart = emailParts[0];
                    const domainPart = emailParts[1];
                    
                    if (forbiddenChars.test(localPart) || forbiddenChars.test(domainPart)) {
                        return false;
                    }
                    
                    // Verificar patrón completo
                    return emailPattern.test(email);
                }
                
                function showEmailError(message) {
                    emailInput.setCustomValidity(message);
                    emailInput.reportValidity();
                }
                
                function clearEmailError() {
                    emailInput.setCustomValidity('');
                }
                
                // Validación en tiempo real mientras el usuario escribe
                emailInput.addEventListener('input', function() {
                    const email = this.value;
                    
                    if (email === '') {
                        clearEmailError();
                        return;
                    }
                    
                    if (!validateEmail(email)) {
                        showEmailError('Formato de email inválido. Solo se permiten letras, números, puntos, guiones y guión bajo.');
                    } else {
                        clearEmailError();
                    }
                });
                
                // Validación al perder el foco
                emailInput.addEventListener('blur', function() {
                    const email = this.value;
                    
                    if (email !== '' && !validateEmail(email)) {
                        showEmailError('Formato de email inválido. Solo se permiten letras, números, puntos, guiones y guión bajo.');
                    }
                });
                
                // Validación antes de enviar el formulario
                const usuarioForm = document.getElementById('usuarioForm');
                if (usuarioForm) {
                    usuarioForm.addEventListener('submit', function(event) {
                        const email = emailInput.value;
                        
                        if (!validateEmail(email)) {
                            event.preventDefault();
                            showEmailError('Formato de email inválido. Solo se permiten letras, números, puntos, guiones y guión bajo.');
                            emailInput.focus();
                            return false;
                        }
                        
                        clearEmailError();
                    });
                }
                
                // Prevenir pegar contenido inválido
                emailInput.addEventListener('paste', function(event) {
                    setTimeout(() => {
                        const email = this.value;
                        if (!validateEmail(email)) {
                            showEmailError('Formato de email inválido. Solo se permiten letras, números, puntos, guiones y guión bajo.');
                        }
                    }, 10);
                });
            }
        });
    </script>
</body>

</html>
