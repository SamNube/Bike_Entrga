<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="../CSS/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="formulario">
        <h1>Registro de Usuario</h1>
        <form method="post" novalidate>
            <div class="campo">
                <input type="text" id="nombre" pattern="[a-zA-Z]{3,}[a-zA-Z0-9 ]*"
                    title="El nombre no debe contener números" required>
                <label for="nombre">Nombre</label>
                <span class="error-message"></span>
            </div>
            <div class="campo">
                <input type="text" id="apellido" pattern="[a-zA-Z]{3,}[a-zA-Z0-9 ]*"
                    title="El apellido no debe contener números" required>
                <label for="apellido">Apellido</label>
                <span class="error-message"></span>
            </div>
            <div class="campo">
                <input type="email" id="email" pattern="^[a-zA-Z0-9.\-_+]+@[^0-9\s@]+\.[^0-9\s@]+$"
                    title="El dominio del correo no debe contener números" required>
                <label for="email">Correo electrónico</label>
                <span class="error-message"></span>
            </div>
            <div class="campo">
                <input type="password" id="contrasena" minlength="8" pattern="[^.:*'|°¬]+"
                    title="La contraseña no debe contener los caracteres: . : * ' | ° ¬" required
                    onpaste="return false;" oncopy="return false;" oncut="return false;" required>
                <label for="contrasena">Contraseña</label>
                <span class="error-message"></span>
            </div>
            <div class="campo">
                <input type="password" id="confirmar-contrasena" required>
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <span class="error-message"></span>
            </div>
            <div class="terminos">
                <input type="checkbox" id="aceptar" name="aceptar" required>
                <label for="aceptar">Acepto los <a href="#">Términos y Condiciones</a></label>
            </div>
            <input type="submit" value="Registrarse">
            <a href="login.html" class="boton-volver">Volver</a>
            <div class="iniciar-sesion">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </form>
    </div>
    <script src="../JavaScript/conexion-registro.js"></script>
</body>

</html>
